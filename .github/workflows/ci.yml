name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go.sum
      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=5m ./...
      - run: go build -trimpath -o dist/ ./cmd/mythoscode
      - name: Verify VS Code integration
        run: node --test editors/vscode/context.test.js

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go.sum
      - name: Prepare explicit test image
        run: docker build --tag mythoscode-sandbox-test -f sandbox/Dockerfile.test sandbox
      - name: Verify actual sandbox isolation
        env:
          MYTHOS_CODE_SANDBOX_IMAGE: mythoscode-sandbox-test
          MYTHOS_CODE_SANDBOX_INTEGRATION: '1'
        run: go test -count=1 -timeout=3m ./internal/sandbox ./internal/jobs

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache-dependency-path: go.sum
      - run: go test -run='^$' -fuzz=FuzzOriginPolicy -fuzztime=5s ./internal/egress
      - run: go test -run='^$' -fuzz=FuzzMCPFrameBounds -fuzztime=5s ./internal/mcp
